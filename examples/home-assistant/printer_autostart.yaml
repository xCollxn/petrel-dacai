# ★ OPTIONAL ADD-ON - not needed for the screen. See README.md in this folder.
#
# Home Assistant package: let Klipper connect by itself after the printer is switched on.
#
# Many printers are switched off at the mains after printing. Klipper then reports
# "Lost communication with MCU" and needs FIRMWARE_RESTART once the printer is on again.
# This automation sends it as soon as the printer draws power.
#
# Requirements
#   - a power sensor for the printer, e.g. from a smart plug   -> PRINTER_POWER_SENSOR
#   - the Moonraker integration (HACS) for the Klipper state   -> sensor.<name>_printer_state / _printer_message
#   - Moonraker reachable from Home Assistant                  -> MOONRAKER_HOST
# Replace the three placeholders, put the file into /config/packages/ and reload
# "REST commands" and "Automations" (no full restart needed).
#
# Safety: it never switches anything; it only fires while Klipper is NOT ready and the
# message is about the lost MCU connection - never on real errors such as heater faults.
# A FIRMWARE_RESTART aborts a running print, which is why it is never sent while ready.

rest_command:
  printer_firmware_restart:
    url: "http://MOONRAKER_HOST:7125/printer/firmware_restart"
    method: post
    timeout: 20

automation:
  - id: printer_autostart_firmware_restart
    alias: "3D printer: connect automatically after power-on"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: PRINTER_POWER_SENSOR          # e.g. sensor.printer_plug_power
        above: 4                                # W; idle printer draws ~7 W, off ~0 W
        for: "00:00:15"
      - trigger: state
        entity_id: sensor.PRINTER_printer_state
        to: ["error", "shutdown"]
        for: "00:00:30"
    conditions:
      - condition: numeric_state
        entity_id: PRINTER_POWER_SENSOR
        above: 4
      - condition: template
        value_template: >-
          {% set st = states("sensor.PRINTER_printer_state") %}
          {% set msg = states("sensor.PRINTER_printer_message") | lower %}
          {{ st in ["error", "shutdown"] and
             ("unable to connect" in msg or "lost communication" in msg
              or "can not update mcu config" in msg) }}
    actions:
      - action: rest_command.printer_firmware_restart
      - wait_template: "{{ is_state('sensor.PRINTER_printer_state', 'ready') }}"
        timeout: "00:00:30"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not is_state('sensor.PRINTER_printer_state', 'ready') }}"
        then:
          # after an abort Klipper sometimes needs a second attempt
          - action: rest_command.printer_firmware_restart
